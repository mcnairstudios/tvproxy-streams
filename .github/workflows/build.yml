name: Build TVProxy Streams Image

on:
  push:
    tags: ['v*']

env:
  IMAGE: gavinmcnair/tvproxy-streams

jobs:
  build-amd64:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_LOGIN}" --password-stdin
      - name: Build
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker build --no-cache -t ${{ env.IMAGE }}:$TAG-amd64 .
      - name: Push
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker push ${{ env.IMAGE }}:$TAG-amd64

  build-arm64:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_LOGIN}" --password-stdin
      - name: Build
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker build --no-cache -t ${{ env.IMAGE }}:$TAG-arm64 .
      - name: Push
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker push ${{ env.IMAGE }}:$TAG-arm64

  manifest:
    needs: [build-amd64, build-arm64]
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Log in to Docker Hub
        run: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_LOGIN}" --password-stdin
      - name: Create and push manifests
        run: |
          TAG=${GITHUB_REF_NAME#v}
          docker manifest rm ${{ env.IMAGE }}:$TAG 2>/dev/null || true
          docker manifest create ${{ env.IMAGE }}:$TAG \
            --amend ${{ env.IMAGE }}:$TAG-amd64 \
            --amend ${{ env.IMAGE }}:$TAG-arm64
          docker manifest push --purge ${{ env.IMAGE }}:$TAG
          docker manifest rm ${{ env.IMAGE }}:latest 2>/dev/null || true
          docker manifest create ${{ env.IMAGE }}:latest \
            --amend ${{ env.IMAGE }}:$TAG-amd64 \
            --amend ${{ env.IMAGE }}:$TAG-arm64
          docker manifest push --purge ${{ env.IMAGE }}:latest
